name: Build ShopyBrain APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL de produccion (ej: https://shopybrain.replit.app)"
        required: false
        default: ""

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Código fuente ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Aceptar licencias Android (SDK ya preinstalado en ubuntu-latest) ─
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || \
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || \
          echo "License acceptance done (or already accepted)"

      # ── 4. Actualizar URL del servidor si hay secret/input ────────────────
      - name: Update server URL
        run: |
          FINAL_URL="${{ github.event.inputs.app_url }}"
          if [ -z "$FINAL_URL" ]; then
            FINAL_URL="${{ secrets.APP_URL }}"
          fi
          CONFIG="artifacts/shopify-optimizer/android/app/src/main/assets/capacitor.config.json"
          if [ -n "$FINAL_URL" ]; then
            echo "Actualizando URL a: $FINAL_URL"
            node -e "
              const fs=require('fs');
              const c=JSON.parse(fs.readFileSync('$CONFIG','utf8'));
              if(!c.server) c.server={};
              c.server.url='$FINAL_URL';
              fs.writeFileSync('$CONFIG',JSON.stringify(c,null,2));
              console.log('URL actualizada:', '$FINAL_URL');
            "
          else
            node -e "const c=JSON.parse(require('fs').readFileSync('$CONFIG','utf8')); console.log('URL actual:', c.server?.url||'no configurada');"
          fi

      # ── 5. Permisos Gradle ────────────────────────────────────────────────
      - name: Grant execute permission to Gradle wrapper
        run: chmod +x artifacts/shopify-optimizer/android/gradlew

      # ── 6. Cache Gradle ───────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/shopify-optimizer/android/**/*.gradle*', 'artifacts/shopify-optimizer/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 7. Build APK debug ────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: artifacts/shopify-optimizer/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── 8. Subir APK como artifact descargable ────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopyBrain-v${{ github.run_number }}
          path: artifacts/shopify-optimizer/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 9. Resumen en GitHub UI ───────────────────────────────────────────
      - name: Build Summary
        run: |
          APK="artifacts/shopify-optimizer/android/app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "## ShopyBrain APK listo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Archivo** | app-debug.apk |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tamaño** | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Descarga el APK en la sección **Artifacts** de este workflow." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Instalar en Android:** Ajustes → Seguridad → Fuentes desconocidas → abrir el .apk" >> $GITHUB_STEP_SUMMARY
