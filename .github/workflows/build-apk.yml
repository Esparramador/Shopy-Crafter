name: Build ShopyBrain APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL de produccion (ej: https://shopybrain.replit.app)"
        required: false
        default: ""

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Código fuente ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Android SDK (pre-instalado en ubuntu-latest) ───────────────────
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Install required Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 4. Actualizar URL del servidor si hay secret/input configurado ────
      - name: Update server URL
        run: |
          FINAL_URL="${{ github.event.inputs.app_url }}"
          if [ -z "$FINAL_URL" ]; then
            FINAL_URL="${{ secrets.APP_URL }}"
          fi
          if [ -n "$FINAL_URL" ]; then
            echo "Actualizando URL del servidor a: $FINAL_URL"
            CONFIG_FILE="artifacts/shopify-optimizer/android/app/src/main/assets/capacitor.config.json"
            node -e "
              const fs = require('fs');
              const c = JSON.parse(fs.readFileSync('$CONFIG_FILE', 'utf8'));
              if (!c.server) c.server = {};
              c.server.url = '$FINAL_URL';
              fs.writeFileSync('$CONFIG_FILE', JSON.stringify(c, null, 2));
              console.log('URL actualizada:', '$FINAL_URL');
            "
          else
            echo "No se especificó APP_URL — se usará la URL por defecto del config"
          fi

      # ── 5. Permisos Gradle ────────────────────────────────────────────────
      - name: Grant execute permission to Gradle wrapper
        run: chmod +x artifacts/shopify-optimizer/android/gradlew

      # ── 6. Cache Gradle ───────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/shopify-optimizer/android/**/*.gradle*', 'artifacts/shopify-optimizer/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 7. Build APK debug ────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: artifacts/shopify-optimizer/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── 8. Subir APK como artifact descargable ────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopyBrain-v${{ github.run_number }}
          path: artifacts/shopify-optimizer/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 9. Resumen en GitHub UI ───────────────────────────────────────────
      - name: Build Summary
        run: |
          APK="artifacts/shopify-optimizer/android/app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "## ShopyBrain APK listo para descargar" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Archivo** | app-debug.apk |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tamaño** | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cómo instalar:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Ve a la pestaña **Actions** → este workflow → sección **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "2. Descarga **ShopyBrain-v${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
          echo "3. Pasa el .apk a tu Android (por cable o WhatsApp)" >> $GITHUB_STEP_SUMMARY
          echo "4. En Android: Ajustes → Seguridad → Instalar apps desconocidas → activar" >> $GITHUB_STEP_SUMMARY
          echo "5. Abre el .apk y pulsa Instalar" >> $GITHUB_STEP_SUMMARY
