name: Build ShopyBrain APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL de produccion (ej: https://shopybrain.replit.app)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Código fuente ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + pnpm (necesario para @capacitor/android en node_modules)
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development

      # ── 3. Java 21 (requerido por capacitor-android 8) ───────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # ── 4. Aceptar licencias Android SDK (preinstalado en ubuntu-latest) ────
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || echo "Licencias aceptadas"

      # ── 5. Actualizar URL del servidor si hay secret/input ────────────────
      - name: Update server URL in Capacitor config
        run: |
          FINAL_URL="${{ github.event.inputs.app_url }}"
          if [ -z "$FINAL_URL" ]; then
            FINAL_URL="${{ secrets.APP_URL }}"
          fi
          CONFIG="artifacts/shopify-optimizer/android/app/src/main/assets/capacitor.config.json"
          if [ -n "$FINAL_URL" ]; then
            node -e "
              const fs=require('fs');
              const c=JSON.parse(fs.readFileSync('$CONFIG','utf8'));
              if(!c.server) c.server={};
              c.server.url='$FINAL_URL';
              fs.writeFileSync('$CONFIG',JSON.stringify(c,null,2));
              console.log('URL configurada:', '$FINAL_URL');
            "
          fi

      # ── 5b. Regenerar rutas nativas de Capacitor ──────────────────────────
      # capacitor.settings.gradle apunta a la carpeta versionada de pnpm
      # (@capacitor+android@X.Y.Z); se regenera para que una subida de versión no rompa el build.
      - name: Sync Capacitor Android project paths
        working-directory: artifacts/shopify-optimizer
        run: pnpm exec cap update android

      # ── 6. Permisos Gradle ────────────────────────────────────────────────
      - name: Grant execute permission to Gradle wrapper
        run: chmod +x artifacts/shopify-optimizer/android/gradlew

      # ── 7. Cache Gradle ───────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/shopify-optimizer/android/**/*.gradle*', 'artifacts/shopify-optimizer/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 8. Build APK debug ────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: artifacts/shopify-optimizer/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── 9. Publicar GitHub Release con el APK (descargable desde la web) ──
      - name: Publish GitHub Release (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "ShopyBrain APK — Última versión"
          body: |
            APK generado automáticamente en el build #${{ github.run_number }}.
            Fecha: ${{ github.event.head_commit.timestamp || 'manual trigger' }}
            Commit: ${{ github.sha }}

            **Instalación en Android:**
            1. Descarga ShopyBrain.apk
            2. Ajustes → Seguridad → Fuentes desconocidas → activar
            3. Abre el .apk → Instalar
          make_latest: true
          prerelease: false
          files: artifacts/shopify-optimizer/android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 10. Renombrar el asset en el release a ShopyBrain.apk ─────────────
      - name: Rename APK asset to ShopyBrain.apk
        run: |
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/apk-latest" \
            | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(d.id);")
          ASSET_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); const a=d.find(x=>x.name.endsWith('.apk')); if(a) console.log(a.id); else process.exit(1);" 2>/dev/null || echo "")
          if [ -n "$ASSET_ID" ]; then
            curl -s -X PATCH \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID" \
              -d '{"name":"ShopyBrain.apk","label":"ShopyBrain APK"}' > /dev/null
            echo "Asset renombrado a ShopyBrain.apk"
          fi

      # ── 11. Resumen ───────────────────────────────────────────────────────
      - name: Build Summary
        run: |
          APK="artifacts/shopify-optimizer/android/app/build/outputs/apk/debug/app-debug.apk"
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "## ShopyBrain APK publicado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tamaño** | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release** | apk-latest |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "El APK está disponible en el botón de la web y en la sección Releases del repo." >> $GITHUB_STEP_SUMMARY
