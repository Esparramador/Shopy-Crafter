kind = "web"
previewPath = "/ceo-empire/"
title = "CEO Empire — Shopy Crafter"
version = "1.0.0"
id = "artifacts/ceo-empire"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/ceo-empire/" ]
localPort = 19908

[services.development]
run = "pnpm --filter @workspace/ceo-empire run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ceo-empire", "run", "build" ]
publicDir = "artifacts/ceo-empire/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19908"
BASE_PATH = "/ceo-empire/"
