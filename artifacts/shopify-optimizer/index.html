<!DOCTYPE html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />

    <!-- ═══ SEO por ruta: el prerender sustituye este bloque en cada página ═══ -->
    <!--seo:start-->
    <title>Shopy Crafter — IA para Shopify, WooCommerce, PrestaShop y Stripe · Diseño web y apps</title>
    <meta name="description" content="Automatizamos tiendas Shopify, WooCommerce y PrestaShop con IA: auditoría, SEO, imágenes de producto, precios con COGS real e inventario. Gestión de Stripe, diseño web 3D y apps nativas." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://shopycrafter.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shopy Crafter" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://shopycrafter.com/" />
    <meta property="og:title" content="Shopy Crafter — IA para Shopify, WooCommerce, PrestaShop y Stripe · Diseño web y apps" />
    <meta property="og:description" content="Automatizamos tiendas Shopify, WooCommerce y PrestaShop con IA: auditoría, SEO, imágenes de producto, precios con COGS real e inventario. Gestión de Stripe, diseño web 3D y apps nativas." />
    <meta property="og:image" content="https://shopycrafter.com/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://shopycrafter.com/opengraph.jpg" />
    <!--seo:end-->
    <meta name="author" content="Shopy Crafter" />
    <!-- ═══ PWA / App ═════════════════════════════════════════════════════════ -->
    <meta name="theme-color" content="#c8a84b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shopy Crafter" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Shopy Crafter" />
    <meta name="msapplication-TileColor" content="#080810" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />

    <!-- ═══ Icons / Manifest ══════════════════════════════════════════════════ -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logo-sc-default.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ═══ Fonts — DNS + Preconnect first, then single stylesheet load ══════ -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" /></noscript>

    <!-- design-system.css is now bundled via Vite (src/design-system.css) for HMR + content-hash cache busting -->

  </head>
  <body>
    <script>
      (function(){
        try {
          var d = localStorage.getItem('shopy-dark');
          if (d === 'false') document.documentElement.setAttribute('data-theme','light');
        } catch(e){}
      })();
    </script>
    <div class="gold-line"></div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const banner = document.getElementById('install-banner');
        if (banner) banner.style.display = 'flex';
      });
      window.onerror = (msg, src, line, col, err) => {
        console.error('Global error:', msg, src, line);
      };
    </script>
  </body>
</html>
