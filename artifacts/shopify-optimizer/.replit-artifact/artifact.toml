kind = "web"
previewPath = "/"
title = "Shopy Crafter"
version = "1.0.0"
id = "artifacts/shopify-optimizer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19080

[services.development]
run = "pnpm --filter @workspace/shopify-optimizer run dev"

[services.production]
publicDir = "artifacts/shopify-optimizer/dist/public"
run = [ "node", "artifacts/shopify-optimizer/server.mjs" ]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/shopify-optimizer", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[[services.production.rewrites]]
from = "/regalo/"
to = "/regalo/index.html"

[[services.production.rewrites]]
from = "/regalo"
to = "/regalo/index.html"

# /instagram/ (escena 3D del QR CEO-IG de las tarjetas): sin esta regla la
# carpeta cae en el comodín /* y sale la home (visto en producción el 04/11/2026).
[[services.production.rewrites]]
from = "/instagram/"
to = "/instagram/index.html"

[[services.production.rewrites]]
from = "/instagram"
to = "/instagram/index.html"

