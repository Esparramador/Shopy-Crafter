kind = "web"
previewPath = "/"
title = "Shopy Crafter"
version = "1.0.0"
id = "artifacts/shopify-optimizer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19080

[services.development]
run = "pnpm --filter @workspace/shopify-optimizer run dev"

[services.production]
publicDir = "artifacts/shopify-optimizer/dist/public"
serve = "static"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/shopify-optimizer", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19080"
BASE_PATH = "/"
