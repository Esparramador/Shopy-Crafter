openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Shopify AI Optimizer Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project management (one per Shopify store)
  - name: products
    description: Shopify product operations
  - name: audit
    description: Product audit and scoring
  - name: redesign
    description: AI-powered product redesign with Claude
  - name: images
    description: Image generation with Replicate
  - name: consistency
    description: Visual consistency engine
  - name: ab-testing
    description: A/B image testing
  - name: pricing
    description: Financial pricing engine
  - name: seo
    description: Technical SEO automation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── PROJECTS ───────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project (one per Shopify store)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by ID
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateProject
      tags: [projects]
      summary: Update project configuration
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /projects/{projectId}/refresh-token:
    post:
      operationId: refreshProjectToken
      tags: [projects]
      summary: Refresh Shopify OAuth access token using client_credentials
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResult"
        "400":
          description: Token refresh failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/test-connection:
    post:
      operationId: testProjectConnection
      tags: [projects]
      summary: Test Shopify connection and token validity
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"

  # ─── PRODUCTS ────────────────────────────────────────────────
  /projects/{projectId}/products:
    get:
      operationId: getProjectProducts
      tags: [products]
      summary: Get all products from Shopify store (with local audit data)
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: grade
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Product list with audit scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

  /projects/{projectId}/products/sync:
    post:
      operationId: syncProducts
      tags: [products]
      summary: Sync all products from Shopify and run audit
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /projects/{projectId}/products/{productId}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get single product with full audit data
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"

  # ─── AUDIT ───────────────────────────────────────────────────
  /projects/{projectId}/audit:
    post:
      operationId: runAudit
      tags: [audit]
      summary: Run product audit for entire store
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Audit summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSummary"

  /projects/{projectId}/products/{productId}/audit:
    post:
      operationId: auditProduct
      tags: [audit]
      summary: Run audit for a single product
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Product audit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAuditResult"

  /projects/{projectId}/catalog-opportunities:
    post:
      operationId: getCatalogOpportunities
      tags: [audit]
      summary: Get AI-suggested missing products for the store niche
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Catalog opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogOpportunity"

  # ─── REDESIGN ────────────────────────────────────────────────
  /projects/{projectId}/products/{productId}/redesign:
    post:
      operationId: redesignProduct
      tags: [redesign]
      summary: AI redesign a single product with Claude
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Redesigned product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedesignResult"

  /projects/{projectId}/products/{productId}/apply-redesign:
    post:
      operationId: applyRedesign
      tags: [redesign]
      summary: Apply redesign to Shopify product
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRedesignInput"
      responses:
        "200":
          description: Apply result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /projects/{projectId}/bulk-redesign:
    post:
      operationId: bulkRedesign
      tags: [redesign]
      summary: Bulk redesign products (all weak or all)
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRedesignInput"
      responses:
        "200":
          description: Bulk redesign job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkJobResponse"

  # ─── IMAGES ──────────────────────────────────────────────────
  /projects/{projectId}/products/{productId}/images/generate:
    post:
      operationId: generateImage
      tags: [images]
      summary: Generate a single product image with Replicate
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateImageInput"
      responses:
        "200":
          description: Generation job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"

  /projects/{projectId}/products/{productId}/images/generate-infographic:
    post:
      operationId: generateInfographic
      tags: [images]
      summary: Generate SVG infographic for a product via Claude
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: SVG infographic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfographicResult"

  /projects/{projectId}/generation-jobs/{jobId}:
    get:
      operationId: getGenerationJob
      tags: [images]
      summary: Poll image generation job status
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"

  /projects/{projectId}/products/{productId}/images/{imageId}/upload-to-shopify:
    post:
      operationId: uploadImageToShopify
      tags: [images]
      summary: Upload a generated image to Shopify product
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /projects/{projectId}/bulk-generate-images:
    post:
      operationId: bulkGenerateImages
      tags: [images]
      summary: Bulk image generation (Boost Masivo)
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkGenerateInput"
      responses:
        "200":
          description: Bulk generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkJobResponse"

  /projects/{projectId}/build-image-prompt:
    post:
      operationId: buildImagePrompt
      tags: [images]
      summary: Preview the image prompt Claude will generate before sending to Replicate
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildPromptInput"
      responses:
        "200":
          description: Preview prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptPreview"

  # ─── VISUAL CONSISTENCY ──────────────────────────────────────
  /projects/{projectId}/visual-dna:
    get:
      operationId: getVisualDna
      tags: [consistency]
      summary: Get stored visual DNA for the store
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Visual DNA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualDna"
    post:
      operationId: extractVisualDna
      tags: [consistency]
      summary: Extract visual DNA from store images via Claude Vision
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Extracted visual DNA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualDna"

  /projects/{projectId}/consistency-scores:
    get:
      operationId: getConsistencyScores
      tags: [consistency]
      summary: Get consistency scores for all products
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Consistency scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyDashboard"

  /projects/{projectId}/repair-consistency:
    post:
      operationId: repairConsistency
      tags: [consistency]
      summary: Repair off-brand product images with StyleLock
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairConsistencyInput"
      responses:
        "200":
          description: Repair job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkJobResponse"

  # ─── A/B TESTING ─────────────────────────────────────────────
  /projects/{projectId}/ab-tests:
    get:
      operationId: listAbTests
      tags: [ab-testing]
      summary: List all A/B tests for a project
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A/B tests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbTest"
    post:
      operationId: createAbTest
      tags: [ab-testing]
      summary: Create a new A/B test
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAbTestInput"
      responses:
        "201":
          description: Test created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbTest"

  /projects/{projectId}/ab-tests/{testId}:
    get:
      operationId: getAbTest
      tags: [ab-testing]
      summary: Get A/B test details
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/testId"
      responses:
        "200":
          description: Test detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbTest"

  /projects/{projectId}/ab-tests/{testId}/declare-winner:
    post:
      operationId: declareAbTestWinner
      tags: [ab-testing]
      summary: Manually declare winner or auto-process stats
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/testId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclareWinnerInput"
      responses:
        "200":
          description: Winner declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbTest"

  /projects/{projectId}/ab-dashboard:
    get:
      operationId: getAbDashboard
      tags: [ab-testing]
      summary: Get A/B testing revenue impact dashboard
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbDashboard"

  /track:
    post:
      operationId: trackEvent
      tags: [ab-testing]
      summary: Pixel tracker endpoint (receives events from tracker.js)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackEvent"
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── PRICING ─────────────────────────────────────────────────
  /projects/{projectId}/products/{productId}/cogs:
    get:
      operationId: getProductCogs
      tags: [pricing]
      summary: Get COGS structure for a product
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: COGS data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CogsData"
    post:
      operationId: saveProductCogs
      tags: [pricing]
      summary: Save COGS structure for a product
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCogsInput"
      responses:
        "200":
          description: COGS saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CogsData"

  /projects/{projectId}/products/{productId}/analyze-competitors:
    post:
      operationId: analyzeCompetitorPrices
      tags: [pricing]
      summary: Scrape and analyze competitor pricing
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorAnalysisInput"
      responses:
        "200":
          description: Competitor price analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorAnalysisResult"

  /projects/{projectId}/products/{productId}/calculate-optimal-price:
    post:
      operationId: calculateOptimalPrice
      tags: [pricing]
      summary: Calculate optimal price using Claude as financial analyst
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Pricing recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRecommendation"

  /projects/{projectId}/products/{productId}/apply-price:
    post:
      operationId: applyPriceToShopify
      tags: [pricing]
      summary: Apply recommended price to Shopify product
      parameters:
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPriceInput"
      responses:
        "200":
          description: Price applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /projects/{projectId}/financial-dashboard:
    get:
      operationId: getFinancialDashboard
      tags: [pricing]
      summary: Get P&L dashboard with live Shopify orders data
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Financial dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialDashboard"

  # ─── SEO ─────────────────────────────────────────────────────
  /projects/{projectId}/seo/audit:
    post:
      operationId: runSeoAudit
      tags: [seo]
      summary: Run full SEO audit for the store
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: SEO audit results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoAuditResult"

  /projects/{projectId}/seo/generate-schemas:
    post:
      operationId: generateSchemas
      tags: [seo]
      summary: Generate JSON-LD schemas and inject to Shopify
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeoActionInput"
      responses:
        "200":
          description: Schema generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkJobResponse"

  /projects/{projectId}/seo/generate-metas:
    post:
      operationId: generateMetas
      tags: [seo]
      summary: Batch generate meta tags for all products missing them
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeoActionInput"
      responses:
        "200":
          description: Meta generation job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkJobResponse"

  /projects/{projectId}/seo/generate-sitemap:
    post:
      operationId: generateSitemap
      tags: [seo]
      summary: Generate XML sitemap and ping Google
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Sitemap result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitemapResult"

  /projects/{projectId}/seo/audit-page-speed:
    post:
      operationId: auditPageSpeed
      tags: [seo]
      summary: Audit Core Web Vitals via PageSpeed Insights
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageSpeedInput"
      responses:
        "200":
          description: PageSpeed results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSpeedResult"

  /projects/{projectId}/seo/keyword-intelligence:
    post:
      operationId: getKeywordIntelligence
      tags: [seo]
      summary: Get keyword strategy for a product
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordInput"
      responses:
        "200":
          description: Keyword strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordStrategy"

  /projects/{projectId}/seo/blog-strategy:
    post:
      operationId: getBlogStrategy
      tags: [seo]
      summary: Generate blog content strategy for the store
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Blog strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogStrategy"

  /projects/{projectId}/seo/generate-blog-post:
    post:
      operationId: generateBlogPost
      tags: [seo]
      summary: Generate a full blog post with Claude
      parameters:
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostInput"
      responses:
        "200":
          description: Generated blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"

  /projects/{projectId}/seo/fix-alt-texts:
    post:
      operationId: fixAltTexts
      tags: [seo]
      summary: Batch generate and apply SEO alt texts for all product images
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Alt text fix job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkJobResponse"

  /projects/{projectId}/jobs/{jobId}:
    get:
      operationId: getJobStatus
      tags: [images]
      summary: Get background job status (bulk operations)
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"

components:
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    testId:
      name: testId
      in: path
      required: true
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    # ─── PROJECT ───────────────────────────────────────────
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        shopDomain:
          type: string
        clientId:
