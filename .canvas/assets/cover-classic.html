<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe Financiero y COGS — Shopy Crafter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #08080e; color: #f0f0f5; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  .page { max-width: 960px; margin: 0 auto; padding: 0; }

  .cover { background: linear-gradient(160deg, #0e0e18 0%, #12121f 50%, #0a0a14 100%); padding: 56px 56px 48px; border-bottom: 1px solid #1a1a28; position: relative; overflow: hidden; }
  .cover::before { content: ''; position: absolute; top: -120px; right: -80px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(200,168,75,.06) 0%, transparent 70%); pointer-events: none; }
  .cover::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, #c8a84b44, transparent); }
  .cover-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 36px; position: relative; z-index: 1; }
  .cover-logo { display: flex; align-items: center; gap: 12px; }
  .cover-logo-icon { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; }
  .cover-logo-icon img { width: 100%; height: 100%; object-fit: cover; }
  .cover-logo-text { font-size: 20px; font-weight: 800; color: #c8a84b; letter-spacing: 1px; text-transform: uppercase; }
  .cover-badge { background: #16161f; border: 1px solid #24243a; border-radius: 8px; padding: 8px 16px; }
  .cover-badge-label { font-size: 10px; color: #6b6b80; text-transform: uppercase; letter-spacing: 1.5px; }
  .cover-badge-value { font-size: 13px; color: #f0f0f5; font-weight: 600; margin-top: 2px; }
  .cover-title { position: relative; z-index: 1; }
  .cover-title h1 { font-size: 32px; font-weight: 900; color: #f0f0f5; letter-spacing: -0.8px; line-height: 1.2; }
  .cover-title h1 span { color: #c8a84b; }
  .cover-title .subtitle { font-size: 15px; color: #9494a8; margin-top: 8px; font-weight: 400; }
  .cover-meta { display: flex; gap: 24px; margin-top: 24px; position: relative; z-index: 1; }
  .cover-meta-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b6b80; }
  .cover-meta-dot { width: 6px; height: 6px; border-radius: 50%; background: #c8a84b; }

  .body-content { padding: 40px 56px 48px; }

  .section { margin-bottom: 40px; }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #1a1a28; }
  .section-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .section-icon-gold { background: rgba(200,168,75,.1); border: 1px solid rgba(200,168,75,.2); }
  .section-icon-jade { background: rgba(52,211,153,.08); border: 1px solid rgba(52,211,153,.2); }
  .section-icon-blue { background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.2); }
  .section-icon-red { background: rgba(244,63,94,.08); border: 1px solid rgba(244,63,94,.2); }
  .section-icon-orange { background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.2); }
  .section-title { font-size: 18px; font-weight: 700; color: #f0f0f5; letter-spacing: -0.3px; }
  .section-count { font-size: 11px; color: #6b6b80; background: #16161f; padding: 2px 8px; border-radius: 4px; margin-left: auto; }

  .card { background: #101018; border: 1px solid #1a1a28; border-radius: 14px; padding: 24px; margin-bottom: 16px; transition: border-color .15s; }
  .card:hover { border-color: #24243a; }

  .metric-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .metric { background: #101018; border: 1px solid #1a1a28; border-radius: 12px; padding: 20px; text-align: center; position: relative; overflow: hidden; }
  .metric::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #c8a84b33, transparent); }
  .metric .value { font-size: 30px; font-weight: 900; color: #c8a84b; letter-spacing: -0.5px; line-height: 1.1; }
  .metric .label { font-size: 10px; color: #6b6b80; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; font-weight: 600; }
  .metric .delta { font-size: 11px; margin-top: 4px; font-weight: 600; }
  .metric .delta-up { color: #34d399; }
  .metric .delta-down { color: #f43f5e; }

  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  thead { position: sticky; top: 0; }
  th { background: #16161f; color: #c8a84b; font-weight: 700; text-align: left; padding: 12px 16px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  th:first-child { border-radius: 8px 0 0 0; }
  th:last-child { border-radius: 0 8px 0 0; }
  td { padding: 12px 16px; border-bottom: 1px solid #1a1a28; color: #f0f0f5; font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(200,168,75,.02); }
  tbody tr { transition: background .1s; }

  .grade { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; padding: 4px 12px; border-radius: 6px; font-weight: 800; font-size: 12px; letter-spacing: 0.3px; }
  .grade-a { background: rgba(52,211,153,.12); color: #34d399; }
  .grade-b { background: rgba(200,168,75,.12); color: #c8a84b; }
  .grade-c { background: rgba(245,158,11,.12); color: #f59e0b; }
  .grade-d { background: rgba(244,63,94,.12); color: #f43f5e; }
  .grade-f { background: rgba(244,63,94,.18); color: #f43f5e; }

  .tag { display: inline-block; background: rgba(200,168,75,.08); color: #c8a84b; padding: 3px 10px; border-radius: 6px; font-size: 11px; margin: 2px 4px 2px 0; font-weight: 600; border: 1px solid rgba(200,168,75,.15); }
  .tag-jade { background: rgba(52,211,153,.08); color: #34d399; border-color: rgba(52,211,153,.15); }
  .tag-red { background: rgba(244,63,94,.08); color: #f43f5e; border-color: rgba(244,63,94,.15); }
  .tag-blue { background: rgba(59,130,246,.08); color: #3b82f6; border-color: rgba(59,130,246,.15); }

  .text-jade { color: #34d399; }
  .text-red { color: #f43f5e; }
  .text-gold { color: #c8a84b; }
  .text-blue { color: #3b82f6; }
  .text-orange { color: #f59e0b; }
  .text-muted { color: #6b6b80; }
  .text-white { color: #f0f0f5; }
  .fw-600 { font-weight: 600; }
  .fw-700 { font-weight: 700; }
  .fw-800 { font-weight: 800; }
  .fs-sm { font-size: 12px; }

  .score-bar { height: 6px; border-radius: 3px; background: #1a1a28; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 3px; transition: width .3s; }

  .recommendation { padding: 16px 20px; margin-bottom: 10px; border-radius: 10px; border-left: 3px solid #c8a84b; background: rgba(200,168,75,.03); font-size: 13px; line-height: 1.7; }
  .recommendation-critical { border-left-color: #f43f5e; background: rgba(244,63,94,.08); }
  .recommendation-success { border-left-color: #34d399; background: rgba(52,211,153,.08); }
  .recommendation-info { border-left-color: #3b82f6; background: rgba(59,130,246,.08); }

  .progress-ring { display: inline-flex; align-items: center; justify-content: center; position: relative; }
  .progress-ring svg { transform: rotate(-90deg); }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stat-item { padding: 16px 20px; background: #16161f; border-radius: 10px; border: 1px solid #1a1a28; }
  .stat-item-label { font-size: 10px; color: #6b6b80; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .stat-item-value { font-size: 16px; font-weight: 700; color: #f0f0f5; margin-top: 4px; }

  .divider { height: 1px; background: linear-gradient(90deg, transparent, #1a1a28, transparent); margin: 32px 0; }

  .report-page { page-break-before: always; padding-top: 12px; }
  .report-page:first-child { page-break-before: avoid; }
  .page-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; margin-bottom: 12px; border-bottom: 1px solid #1a1a28; }
  .page-header-title { font-size: 11px; color: #6b6b80; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
  .page-header-num { font-size: 11px; color: #c8a84b; font-weight: 700; }

  .toc { padding: 24px 0; }
  .toc-item { display: flex; align-items: center; padding: 12px 16px; margin-bottom: 6px; border-radius: 10px; background: #101018; border: 1px solid #1a1a28; }
  .toc-num { width: 32px; height: 32px; border-radius: 8px; background: rgba(200,168,75,.1); border: 1px solid rgba(200,168,75,.2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #c8a84b; margin-right: 16px; flex-shrink: 0; }
  .toc-label { font-size: 14px; font-weight: 600; color: #f0f0f5; }
  .toc-desc { font-size: 11px; color: #6b6b80; margin-top: 2px; }
  .toc-dot { flex: 1; border-bottom: 1px dotted #1a1a28; margin: 0 12px; min-width: 40px; }

  .waterfall-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .waterfall-label { font-size: 12px; color: #9494a8; min-width: 120px; text-align: right; }
  .waterfall-fill { height: 24px; border-radius: 6px; min-width: 2px; display: flex; align-items: center; padding: 0 8px; }
  .waterfall-val { font-size: 11px; font-weight: 700; color: #f0f0f5; }

  .blog-content { font-size: 14px; line-height: 1.8; }
  .blog-content h1, .blog-content h2, .blog-content h3 { color: #c8a84b; margin: 20px 0 10px; }
  .blog-content p { margin-bottom: 12px; }
  .blog-content ul, .blog-content ol { margin: 10px 0 10px 20px; }

  .footer { padding: 32px 56px; border-top: 1px solid #1a1a28; background: #0c0c14; text-align: center; }
  .footer-brand { font-size: 14px; font-weight: 700; color: #c8a84b; }
  .footer-sub { font-size: 11px; color: #6b6b80; margin-top: 6px; }
  .footer-line { width: 40px; height: 2px; background: #c8a84b; margin: 12px auto; border-radius: 1px; }

  @media print {
    body { background: white; color: #1a1a1a; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page { max-width: 100%; }
    .cover { background: #f8f7f4; padding: 32px; }
    .cover-title h1 { color: #1a1a1a; }
    .card, .metric, .recommendation, .toc-item, .stat-item { break-inside: avoid; }
    table, tr { break-inside: avoid; }
    .metric-row, .stat-grid { break-inside: avoid; }
    .card, .metric { background: #fafafa; border: 1px solid #e0e0e0; }
    .metric .value { color: #8b6914; }
    th { background: #f0f0f0; color: #8b6914; }
    td { border-color: #e8e8e8; color: #1a1a1a; }
    .footer { background: #fafafa; border-color: #e0e0e0; }
  }
</style>
</head>
