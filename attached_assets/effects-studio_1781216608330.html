<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Effects Studio · Crafter Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d1a;--surface:#13131f;--surface2:#1a1a2e;--border:rgba(255,255,255,.07);
  --primary:#6366f1;--accent:#ec4899;--gold:#c9a961;
  --text:#f1f5f9;--muted:rgba(255,255,255,.45);--muted2:rgba(255,255,255,.25);
  --radius:12px;--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* ── Top bar ── */
.topbar{display:flex;align-items:center;gap:16px;padding:0 20px;height:52px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);}
.topbar h1{font-size:.9rem;font-weight:600;white-space:nowrap;}
.topbar h1 span{color:var(--gold);}
.topbar .search-wrap{flex:1;max-width:340px;position:relative;}
.topbar .search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px 6px 32px;color:var(--text);font-size:.82rem;outline:none;}
.topbar .search-wrap::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;}
.topbar select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 10px;color:var(--text);font-size:.8rem;outline:none;cursor:pointer;}
.topbar .mode-tabs{display:flex;gap:4px;margin-left:auto;}
.mode-tab{padding:5px 14px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s;}
.mode-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.compose-bar{display:none;align-items:center;gap:10px;padding:6px 16px 6px 8px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);border-radius:var(--radius);font-size:.82rem;}
.compose-bar.visible{display:flex;}
.compose-bar .count{background:var(--primary);color:#fff;border-radius:100px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;}
.compose-bar button{margin-left:auto;padding:5px 16px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;cursor:pointer;}
.compose-bar .clear-btn{background:transparent;color:var(--muted);border:none;cursor:pointer;font-size:.8rem;padding:2px 6px;}

/* ── Layout ── */
.studio-body{display:flex;flex:1;overflow:hidden;}

/* ── Sidebar ── */
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:10px 0;}
.sidebar::-webkit-scrollbar{width:4px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);}
.cat-section{margin-bottom:4px;}
.cat-source{padding:8px 16px 4px;font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);}
.cat-item{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;cursor:pointer;font-size:.8rem;color:var(--muted);transition:all .15s;border-radius:0;}
.cat-item:hover{background:rgba(255,255,255,.04);color:var(--text);}
.cat-item.active{background:rgba(99,102,241,.12);color:var(--primary);}
.cat-item .badge{background:rgba(255,255,255,.08);border-radius:100px;padding:1px 7px;font-size:.68rem;color:var(--muted);}
.cat-item.active .badge{background:rgba(99,102,241,.2);color:var(--primary);}

/* ── Grid ── */
.grid-area{flex:1;overflow-y:auto;padding:16px;}
.grid-area::-webkit-scrollbar{width:4px;}
.grid-area::-webkit-scrollbar-thumb{background:var(--border);}
.grid-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.grid-header .title{font-size:.85rem;font-weight:600;}
.grid-header .subtitle{font-size:.75rem;color:var(--muted);}
.effects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.effect-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;position:relative;}
.effect-card:hover{border-color:rgba(99,102,241,.4);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.effect-card.selected{border-color:var(--primary);background:rgba(99,102,241,.08);}
.effect-card .ec-icon{font-size:1.4rem;margin-bottom:8px;}
.effect-card .ec-source{position:absolute;top:10px;right:10px;font-size:.62rem;padding:2px 6px;border-radius:100px;font-weight:600;text-transform:uppercase;}
.ec-source.builtin{background:rgba(16,185,129,.15);color:#10b981;}
.ec-source.visme{background:rgba(99,102,241,.15);color:var(--primary);}
.ec-source.effects_prompts{background:rgba(201,169,97,.15);color:var(--gold);}
.ec-source.stitch{background:rgba(236,72,153,.15);color:var(--accent);}
.effect-card h4{font-size:.8rem;font-weight:600;margin-bottom:4px;line-height:1.3;}
.effect-card p{font-size:.73rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.effect-card .ec-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.effect-card .ec-tag{font-size:.65rem;background:rgba(255,255,255,.05);color:var(--muted2);padding:2px 6px;border-radius:4px;}
.effect-card .select-check{position:absolute;bottom:10px;right:10px;width:18px;height:18px;background:var(--primary);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:.7rem;color:#fff;}
.effect-card.selected .select-check{display:flex;}
.load-more{margin-top:16px;text-align:center;}
.load-more button{padding:8px 24px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);font-size:.8rem;cursor:pointer;}
.load-more button:hover{color:var(--text);}

/* ── Detail panel ── */
.detail-panel{width:360px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.detail-panel.hidden{display:none;}
.dp-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.dp-header .dp-title{font-size:.9rem;font-weight:600;line-height:1.3;}
.dp-header .dp-source{font-size:.7rem;padding:2px 8px;border-radius:100px;font-weight:600;}
.dp-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px;line-height:1;}
.dp-body{flex:1;overflow-y:auto;padding:16px;}
.dp-body::-webkit-scrollbar{width:3px;}
.dp-body::-webkit-scrollbar-thumb{background:var(--border);}
.dp-desc{font-size:.78rem;color:var(--muted);line-height:1.5;margin-bottom:16px;}
.dp-section{margin-bottom:16px;}
.dp-section-title{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);margin-bottom:8px;}
.dp-field{margin-bottom:10px;}
.dp-field label{display:block;font-size:.73rem;color:var(--muted);margin-bottom:4px;}
.dp-field input,.dp-field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;color:var(--text);font-size:.8rem;outline:none;}
.dp-field input:focus,.dp-field select:focus{border-color:var(--primary);}
.color-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.color-input-wrap{position:relative;}
.color-input-wrap input[type=color]{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:none;background:none;cursor:pointer;padding:0;}
.color-input-wrap input[type=text]{padding-left:34px;}
.dp-actions{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.btn-generate{width:100%;padding:11px;background:linear-gradient(135deg,var(--primary),var(--accent));border:none;border-radius:var(--radius-sm);color:#fff;font-family:'Inter',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .2s;}
.btn-generate:hover{opacity:.9;}
.btn-generate:disabled{opacity:.4;cursor:not-allowed;}
.btn-preview{width:100%;padding:9px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:.82rem;cursor:pointer;}
.btn-preview:hover{border-color:rgba(255,255,255,.2);}
.generating-bar{display:none;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);justify-content:center;}
.generating-bar.show{display:flex;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;}

/* ── Preview panel ── */
.preview-panel{position:fixed;inset:0;background:var(--bg);z-index:1000;display:none;flex-direction:column;}
.preview-panel.show{display:flex;}
.preview-topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
.preview-topbar h3{font-size:.85rem;font-weight:600;flex:1;}
.preview-topbar .preview-actions{display:flex;gap:8px;}
.preview-topbar .preview-actions button{padding:5px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.78rem;cursor:pointer;}
.preview-topbar .preview-actions button.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.preview-iframe{flex:1;border:none;width:100%;background:#fff;}
.preview-code{display:none;flex:1;overflow:auto;padding:16px;}
.preview-code pre{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:#a5f3fc;line-height:1.6;white-space:pre-wrap;word-break:break-all;}

/* ── Loading overlay ── */
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(13,13,26,.85);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.loading-overlay.show{display:flex;}
.loading-overlay .lo-text{font-size:.9rem;color:var(--muted);}
.lo-ring{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}

/* ── Empty state ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .es-icon{font-size:2.5rem;margin-bottom:12px;}
.empty-state p{font-size:.85rem;}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>✦ <span>Effects</span> Studio</h1>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Buscar efectos, categorías, técnicas..." oninput="onSearch()">
  </div>
  <select id="sourceFilter" onchange="loadTemplates()">
    <option value="all">Todas las fuentes</option>
    <option value="builtin">⚡ Pre-built (sin API)</option>
    <option value="visme">🎨 Visme (594)</option>
    <option value="effects_prompts">✦ Effects Prompts</option>
    <option value="stitch">🔮 Stitch</option>
  </select>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('browse')">Explorar</button>
    <button class="mode-tab" onclick="setMode('compose')">Componer</button>
  </div>
  <div class="compose-bar" id="composeBar">
    <div class="count" id="composeCount">0</div>
    <span id="composeLabel">efectos seleccionados</span>
    <button onclick="clearCompose()" class="clear-btn">✕</button>
    <button onclick="openComposeModal()">Componer página ➜</button>
  </div>
</div>

<!-- Studio body -->
<div class="studio-body">

  <!-- Sidebar categories -->
  <div class="sidebar" id="categorySidebar">
    <div class="cat-section">
      <div class="cat-source">Pre-built</div>
      <div class="cat-item active" onclick="selectCategory('','builtin')" id="cat-all-builtin">
        <span>Todos los snippets</span>
        <span class="badge">30</span>
      </div>
    </div>
    <div class="cat-section">
      <div class="cat-source">Visme Templates</div>
      <div id="vismeCatList"></div>
    </div>
    <div class="cat-section">
      <div class="cat-source">Otras fuentes</div>
      <div class="cat-item" onclick="selectCategory('','effects_prompts')">
        <span>Effects Prompts</span>
        <span class="badge" id="badge-ep">–</span>
      </div>
      <div class="cat-item" onclick="selectCategory('','stitch')">
        <span>Stitch Effects</span>
        <span class="badge" id="badge-st">–</span>
      </div>
    </div>
  </div>

  <!-- Card grid -->
  <div class="grid-area" id="gridArea">
    <div class="grid-header">
      <div>
        <div class="title" id="gridTitle">Todos los efectos</div>
        <div class="subtitle" id="gridSubtitle">Cargando catálogo…</div>
      </div>
    </div>
    <div class="effects-grid" id="effectsGrid">
      <div class="empty-state"><div class="es-icon">⏳</div><p>Cargando efectos…</p></div>
    </div>
    <div class="load-more" id="loadMoreDiv" style="display:none">
      <button onclick="loadMore()">Cargar más efectos</button>
    </div>
  </div>

  <!-- Detail panel -->
  <div class="detail-panel hidden" id="detailPanel">
    <div class="dp-header">
      <div>
        <div class="dp-title" id="dpTitle">–</div>
        <div class="dp-source" id="dpSource">–</div>
      </div>
      <button class="dp-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="dp-body">
      <p class="dp-desc" id="dpDesc">–</p>

      <div class="dp-section">
        <div class="dp-section-title">DNA del Cliente</div>
        <div class="dp-field">
          <label>Nombre de marca</label>
          <input type="text" id="dna-name" value="Mi Marca" placeholder="Ej: Rasta Lo">
        </div>
        <div class="dp-field">
          <label>Sector / Industria</label>
          <input type="text" id="dna-sector" value="Agency" placeholder="restaurante, SaaS, moda…">
        </div>
        <div class="dp-field">
          <label>Fuente Google (tipografía)</label>
          <input type="text" id="dna-font" value="Inter" placeholder="Inter, Playfair Display…">
        </div>
        <div class="dp-field color-row">
          <div>
            <label>Color primario</label>
            <div class="color-input-wrap">
              <input type="color" id="dna-primary-picker" value="#6366f1" oninput="syncColor('primary')">
              <input type="text" id="dna-primary" value="#6366f1" oninput="syncColorPicker('primary')">
            </div>
          </div>
          <div>
            <label>Color secundario</label>
            <div class="color-input-wrap">
              <input type="color" id="dna-secondary-picker" value="#ec4899" oninput="syncColor('secondary')">
              <input type="text" id="dna-secondary" value="#ec4899" oninput="syncColorPicker('secondary')">
            </div>
          </div>
        </div>
        <div class="dp-field color-row">
          <div>
            <label>Fondo</label>
            <div class="color-input-wrap">
              <input type="color" id="dna-bg-picker" value="#0d0d1a" oninput="syncColor('bg')">
              <input type="text" id="dna-bg" value="#0d0d1a" oninput="syncColorPicker('bg')">
            </div>
          </div>
          <div>
            <label>Superficie</label>
            <div class="color-input-wrap">
              <input type="color" id="dna-surface-picker" value="#1a1a2e" oninput="syncColor('surface')">
              <input type="text" id="dna-surface" value="#1a1a2e" oninput="syncColorPicker('surface')">
            </div>
          </div>
        </div>
        <div class="dp-field">
          <label>Headline principal</label>
          <input type="text" id="dna-headline" value="Construye algo extraordinario" placeholder="Tu propuesta de valor">
        </div>
        <div class="dp-field">
          <label>Tagline</label>
          <input type="text" id="dna-tagline" value="La agencia que convierte ideas en experiencias">
        </div>
        <div class="dp-field">
          <label>CTA principal</label>
          <input type="text" id="dna-cta" value="Empezar ahora">
        </div>
      </div>
    </div>
    <div class="dp-actions">
      <div class="generating-bar" id="generatingBar">
        <div class="spinner"></div>
        <span>Generando con IA…</span>
      </div>
      <button class="btn-generate" id="btnGenerate" onclick="generateEffect()">
        ⚡ Generar efecto
      </button>
      <button class="btn-preview" onclick="previewBuiltin()" id="btnInstant" style="display:none">
        👁 Preview instantáneo (sin API)
      </button>
    </div>
  </div>

</div>

<!-- Preview panel (fullscreen) -->
<div class="preview-panel" id="previewPanel">
  <div class="preview-topbar">
    <h3 id="previewTitle">Preview</h3>
    <div class="preview-actions">
      <button onclick="togglePreviewCode()" id="btnToggleCode">Ver código</button>
      <button onclick="copyHtml()" class="primary">Copiar HTML</button>
      <button onclick="saveToVault()">Guardar en Vault</button>
      <button onclick="closePreview()">✕ Cerrar</button>
    </div>
  </div>
  <iframe class="preview-iframe" id="previewIframe" sandbox="allow-scripts allow-same-origin" title="Effect Preview"></iframe>
  <div class="preview-code" id="previewCode">
    <pre id="previewCodePre"></pre>
  </div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="lo-ring"></div>
  <div class="lo-text" id="loadingText">Generando efecto con IA…</div>
</div>

<script>
'use strict';

const API = '';
let _currentTemplate = null;
let _allResults = [];
let _displayedCount = 0;
const PAGE_SIZE = 40;
let _mode = 'browse';
let _selectedEffects = [];
let _currentCategory = '';
let _currentSource = 'all';
let _generatedHtml = '';
let _searchTimer = null;

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  await Promise.all([loadCategories(), loadTemplates()]);
}

async function loadCategories() {
  try {
    const r = await fetch(API + '/api/visme/categories');
    const d = await r.json();
    const list = document.getElementById('vismeCatList');
    // Sort by count desc, show top 25
    const sorted = (d.categories || []).sort((a,b) => b.count - a.count).slice(0, 25);
    list.innerHTML = sorted.map(c => `
      <div class="cat-item" onclick="selectCategory('${c.id}','visme')" id="cat-visme-${c.id}">
        <span>${c.name || c.id}</span>
        <span class="badge">${c.count || ''}</span>
      </div>`).join('');
    if (d.totals) {
      document.getElementById('badge-ep').textContent = d.totals.effects_prompts || '–';
      document.getElementById('badge-st').textContent = d.totals.stitch_effects || '–';
    }
  } catch(e) { console.error('loadCategories', e); }
}

async function loadTemplates() {
  const q = document.getElementById('searchInput').value.trim();
  const source = document.getElementById('sourceFilter').value || _currentSource;
  const category = _currentCategory;
  try {
    const url = `${API}/api/visme/templates?q=${encodeURIComponent(q)}&category=${encodeURIComponent(category)}&source=${source}&limit=200`;
    const r = await fetch(url);
    const d = await r.json();
    _allResults = d.results || [];
    _displayedCount = 0;
    renderGrid();
  } catch(e) {
    document.getElementById('effectsGrid').innerHTML = `<div class="empty-state"><div class="es-icon">⚠️</div><p>Error cargando efectos. Verifica que el backend esté en ejecución.</p></div>`;
  }
}

function renderGrid() {
  const grid = document.getElementById('effectsGrid');
  const batch = _allResults.slice(0, _displayedCount + PAGE_SIZE);
  _displayedCount = batch.length;
  const subtitle = document.getElementById('gridSubtitle');
  subtitle.textContent = `${_allResults.length} efectos encontrados`;

  if (!batch.length) {
    grid.innerHTML = `<div class="empty-state"><div class="es-icon">🔍</div><p>No se encontraron efectos para esta búsqueda.</p></div>`;
    document.getElementById('loadMoreDiv').style.display = 'none';
    return;
  }

  grid.innerHTML = batch.map(t => {
    const isSelected = _selectedEffects.includes(t.id);
    const icon = t.icon || _effectIcon(t.category);
    const tags = (t.tags || []).slice(0,3).map(tag => `<span class="ec-tag">${tag}</span>`).join('');
    return `<div class="effect-card${isSelected?' selected':''}" onclick="selectEffect('${t.id}',event)" data-id="${t.id}">
      <span class="ec-source ${t.source||'visme'}">${_sourceLabel(t.source)}</span>
      <div class="ec-icon">${icon}</div>
      <h4>${t.name||t.id}</h4>
      <p>${t.description||''}</p>
      ${tags ? `<div class="ec-tags">${tags}</div>` : ''}
      <div class="select-check">✓</div>
    </div>`;
  }).join('');

  document.getElementById('loadMoreDiv').style.display = _displayedCount < _allResults.length ? 'block' : 'none';
}

function _sourceLabel(src) {
  const map = {builtin:'⚡ Built-in',visme:'Visme',effects_prompts:'FX Prompts',stitch:'Stitch'};
  return map[src] || src || 'visme';
}

function _effectIcon(cat) {
  const map = {
    '3d_effects':'🧊','particle_effects':'✨','background_effects':'🌌','text_effects':'Aa',
    'transition_effects':'⇄','micro_interactions':'👆','interactive_effects':'🖱️',
    'motion_graphics':'🎬','parallax_effects':'📜','logo_animations':'🔵','animated_icons':'⚡',
    'forms_surveys':'📝','landing_pages':'🚀','charts':'📊','loaders':'⏳',
    'celebration_effects':'🎉','typography_effects':'✍️','3d':'🧊','overlay_effects':'🖼️',
    'scroll_indicators':'↓','cards':'🃏',
  };
  return map[cat] || '🎨';
}

function loadMore() {
  const batch = _allResults.slice(_displayedCount, _displayedCount + PAGE_SIZE);
  _displayedCount += batch.length;
  const grid = document.getElementById('effectsGrid');
  batch.forEach(t => {
    const isSelected = _selectedEffects.includes(t.id);
    const icon = t.icon || _effectIcon(t.category);
    const card = document.createElement('div');
    card.className = 'effect-card' + (isSelected ? ' selected' : '');
    card.dataset.id = t.id;
    card.onclick = (e) => selectEffect(t.id, e);
    card.innerHTML = `<span class="ec-source ${t.source||'visme'}">${_sourceLabel(t.source)}</span>
      <div class="ec-icon">${icon}</div><h4>${t.name||t.id}</h4><p>${t.description||''}</p>
      <div class="select-check">✓</div>`;
    grid.appendChild(card);
  });
  document.getElementById('loadMoreDiv').style.display = _displayedCount < _allResults.length ? 'block' : 'none';
}

// ── Category / Search ──────────────────────────────────────────────────────
function selectCategory(catId, source) {
  _currentCategory = catId;
  _currentSource = source || 'all';
  document.getElementById('sourceFilter').value = _currentSource;
  // Update active state
  document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
  const target = catId ? document.getElementById(`cat-${source}-${catId}`) : document.getElementById(`cat-all-${source}`);
  if (target) target.classList.add('active');
  const titleMap = {
    visme: 'Visme Templates',
    builtin: 'Pre-built Snippets (sin API)',
    effects_prompts: 'Effects Prompts',
    stitch: 'Stitch Effects',
  };
  document.getElementById('gridTitle').textContent = catId
    ? catId.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())
    : (titleMap[source] || 'Todos los efectos');
  loadTemplates();
}

function onSearch() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(loadTemplates, 280);
}

// ── Effect selection ───────────────────────────────────────────────────────
async function selectEffect(tid, evt) {
  if (_mode === 'compose') {
    evt && evt.stopPropagation();
    toggleCompose(tid);
    return;
  }
  // Find in results
  const t = _allResults.find(x => x.id === tid);
  if (!t) return;
  _currentTemplate = t;
  openDetail(t);
}

function openDetail(t) {
  document.getElementById('detailPanel').classList.remove('hidden');
  document.getElementById('dpTitle').textContent = t.name || t.id;
  const srcColors = {builtin:'#10b981',visme:'var(--primary)',effects_prompts:'var(--gold)',stitch:'var(--accent)'};
  const srcEl = document.getElementById('dpSource');
  srcEl.textContent = _sourceLabel(t.source);
  srcEl.style.background = (srcColors[t.source]||'var(--primary)') + '20';
  srcEl.style.color = srcColors[t.source] || 'var(--primary)';
  document.getElementById('dpDesc').textContent = t.description || '–';
  // Show instant preview btn only for pre-built
  document.getElementById('btnInstant').style.display = t.source === 'builtin' ? 'block' : 'none';
  document.getElementById('btnGenerate').textContent = t.source === 'builtin'
    ? '⚡ Generar con DNA' : '🤖 Generar con IA';
}

function closeDetail() {
  document.getElementById('detailPanel').classList.add('hidden');
  _currentTemplate = null;
}

// ── DNA helpers ────────────────────────────────────────────────────────────
function getDNA() {
  return {
    name:           document.getElementById('dna-name').value,
    sector:         document.getElementById('dna-sector').value,
    font:           document.getElementById('dna-font').value,
    primary_color:  document.getElementById('dna-primary').value,
    secondary_color:document.getElementById('dna-secondary').value,
    bg_color:       document.getElementById('dna-bg').value,
    surface_color:  document.getElementById('dna-surface').value,
    headline:       document.getElementById('dna-headline').value,
    tagline:        document.getElementById('dna-tagline').value,
    cta:            document.getElementById('dna-cta').value,
  };
}

function syncColor(key) {
  const picker = document.getElementById(`dna-${key}-picker`);
  document.getElementById(`dna-${key}`).value = picker.value;
}
function syncColorPicker(key) {
  const txt = document.getElementById(`dna-${key}`);
  const picker = document.getElementById(`dna-${key}-picker`);
  if (/^#[0-9a-f]{6}$/i.test(txt.value)) picker.value = txt.value;
}

// ── Generate ───────────────────────────────────────────────────────────────
async function generateEffect() {
  if (!_currentTemplate) return;
  const dna = getDNA();
  const btn = document.getElementById('btnGenerate');
  const bar = document.getElementById('generatingBar');
  btn.disabled = true;
  bar.classList.add('show');
  try {
    const body = { template_id: _currentTemplate.id, dna };
    const r = await fetch(API + '/api/visme/generate', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!d.ok || !d.html) throw new Error(d.error || 'Sin respuesta HTML');
    _generatedHtml = d.html;
    openPreview(d.html, _currentTemplate.name);
  } catch(e) {
    alert('Error generando: ' + e.message);
  } finally {
    btn.disabled = false;
    bar.classList.remove('show');
  }
}

async function previewBuiltin() {
  if (!_currentTemplate || _currentTemplate.source !== 'builtin') return;
  const dna = getDNA();
  try {
    const r = await fetch(API + '/api/visme/preview-snippet', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ snippet_id: _currentTemplate.id, dna }),
    });
    const d = await r.json();
    if (d.html) { _generatedHtml = d.html; openPreview(d.html, _currentTemplate.name); }
  } catch(e) { alert('Error: ' + e.message); }
}

// ── Preview ────────────────────────────────────────────────────────────────
function openPreview(html, title) {
  document.getElementById('previewTitle').textContent = title || 'Preview';
  document.getElementById('previewIframe').srcdoc = html;
  document.getElementById('previewCodePre').textContent = html;
  document.getElementById('previewCode').style.display = 'none';
  document.getElementById('previewIframe').style.display = 'block';
  document.getElementById('previewPanel').classList.add('show');
  document.getElementById('btnToggleCode').textContent = 'Ver código';
}

function closePreview() {
  document.getElementById('previewPanel').classList.remove('show');
  document.getElementById('previewIframe').srcdoc = '';
}

function togglePreviewCode() {
  const iframe = document.getElementById('previewIframe');
  const code = document.getElementById('previewCode');
  const btn = document.getElementById('btnToggleCode');
  if (code.style.display === 'none') {
    code.style.display = 'block'; iframe.style.display = 'none';
    btn.textContent = 'Ver preview';
  } else {
    code.style.display = 'none'; iframe.style.display = 'block';
    btn.textContent = 'Ver código';
  }
}

function copyHtml() {
  if (!_generatedHtml) return;
  navigator.clipboard.writeText(_generatedHtml).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✓ Copiado!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

async function saveToVault() {
  if (!_generatedHtml) return;
  const name = (_currentTemplate?.name || 'effect') + '_' + Date.now();
  try {
    const r = await fetch(API + '/api/vault/save', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, content: _generatedHtml, type: 'html', source: 'effects-studio' }),
    });
    const d = await r.json();
    if (d.ok) alert('Guardado en Vault: ' + name);
    else alert('Error guardando: ' + (d.error || 'desconocido'));
  } catch(e) { alert('Error: ' + e.message); }
}

// ── Compose mode ───────────────────────────────────────────────────────────
function setMode(mode) {
  _mode = mode;
  document.querySelectorAll('.mode-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&mode==='browse')||(i===1&&mode==='compose')));
  if (mode === 'browse') { clearCompose(); }
  if (mode === 'compose') {
    document.getElementById('detailPanel').classList.add('hidden');
  }
}

function toggleCompose(tid) {
  const idx = _selectedEffects.indexOf(tid);
  if (idx >= 0) {
    _selectedEffects.splice(idx, 1);
  } else if (_selectedEffects.length < 8) {
    _selectedEffects.push(tid);
  }
  // Update card visual
  document.querySelectorAll(`.effect-card[data-id="${tid}"]`).forEach(el => {
    el.classList.toggle('selected', _selectedEffects.includes(tid));
  });
  updateComposeBar();
}

function updateComposeBar() {
  const bar = document.getElementById('composeBar');
  const count = document.getElementById('composeCount');
  const label = document.getElementById('composeLabel');
  count.textContent = _selectedEffects.length;
  label.textContent = _selectedEffects.length === 1 ? 'efecto seleccionado' : 'efectos seleccionados';
  bar.classList.toggle('visible', _selectedEffects.length > 0);
}

function clearCompose() {
  _selectedEffects = [];
  document.querySelectorAll('.effect-card.selected').forEach(el => el.classList.remove('selected'));
  updateComposeBar();
}

async function openComposeModal() {
  if (!_selectedEffects.length) return;
  const dna = getDNA();
  document.getElementById('loadingText').textContent = `Componiendo ${_selectedEffects.length} efectos con IA…`;
  document.getElementById('loadingOverlay').classList.add('show');
  try {
    const r = await fetch(API + '/api/visme/compose', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ effect_ids: _selectedEffects, dna, page_type: 'landing' }),
    });
    const d = await r.json();
    if (!d.ok || !d.html) throw new Error(d.error || 'Sin respuesta');
    _generatedHtml = d.html;
    openPreview(d.html, `Composición de ${_selectedEffects.length} efectos`);
  } catch(e) {
    alert('Error componiendo: ' + e.message);
  } finally {
    document.getElementById('loadingOverlay').classList.remove('show');
  }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
