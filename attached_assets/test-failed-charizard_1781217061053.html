<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>

<title>Login · Crafter Agency AI</title>

<style>
/* ─── TOKENS ─────────────────────────────────────────── */
:root{
  --bg-off:   #0d0d12;
  --bg-on:    #1a0e08;
  --glow-col: #ff6a00;
  --p1:       #6366f1;
  --p2:       #ec4899;
  --text:     #f1f5f9;
  --mute:     #94a3b8;
  --border:   rgba(255,255,255,0.09);
  --font:     'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
body{
  background:var(--bg-off);
  color:var(--text);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;
  transition:background .8s ease;
}

/* ── FIRE GLOW OVERLAY ──────────────────────────── */
#fire-glow{
  position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% 40%,
    rgba(255,100,0,0.22) 0%,rgba(255,60,0,0.08) 50%,transparent 80%);
  opacity:0;pointer-events:none;z-index:0;
  transition:opacity .5s;
}

/* ── CHARIZARD WRAP ─────────────────────────────── */
#char-wrap{
  position:relative;
  width:260px;
  cursor:pointer;
  z-index:2;
  -webkit-user-select:none;user-select:none;
  filter:drop-shadow(0 12px 32px rgba(0,0,0,0.6));
  transition:filter .4s;
}
#char-wrap:hover{filter:drop-shadow(0 12px 32px rgba(255,100,0,0.35))}
#char-wrap svg{width:100%;display:block}

/* click-ripple */
#char-wrap::after{
  content:'';position:absolute;
  inset:-8px;border-radius:50%;
  background:rgba(255,100,0,0);
  pointer-events:none;
}

/* ── FLAME BREATH (hidden by default) ───────────── */
#flame-container{
  position:absolute;
  top:34%;left:56%;
  pointer-events:none;
  z-index:3;
  opacity:0;
  transform-origin:left center;
}
.flame-stream{
  position:relative;
  display:flex;align-items:center;
  gap:0;
}
.fl{
  width:22px;height:22px;
  border-radius:50% 50% 20% 20%;
  position:absolute;
  animation:flamePulse .18s ease-in-out infinite alternate;
  transform-origin:left center;
}
.fl1{background:radial-gradient(circle,#fff9c4,#ffeb3b);width:28px;height:28px;left:0;top:-14px;animation-delay:0s}
.fl2{background:radial-gradient(circle,#ffeb3b,#ff9800);width:36px;height:36px;left:18px;top:-18px;animation-delay:.04s}
.fl3{background:radial-gradient(circle,#ff9800,#ff5722);width:48px;height:48px;left:44px;top:-24px;animation-delay:.08s}
.fl4{background:radial-gradient(circle,#ff5722,#e53935);width:60px;height:60px;left:82px;top:-30px;animation-delay:.12s}
.fl5{background:radial-gradient(circle,#e53935,rgba(183,28,28,0));width:80px;height:80px;left:130px;top:-40px;animation-delay:.16s}
.fl6{background:radial-gradient(circle,rgba(183,28,28,0.6),transparent);width:110px;height:110px;left:190px;top:-55px;animation-delay:.20s}

@keyframes flamePulse{
  0%{transform:scaleY(1) scaleX(1);opacity:1}
  100%{transform:scaleY(1.18) scaleX(.92);opacity:.85}
}

/* Embers / sparks */
.ember{
  position:absolute;
  width:4px;height:4px;
  border-radius:50%;
  pointer-events:none;
  animation:emberFly 0.6s ease-out forwards;
  z-index:4;
}
@keyframes emberFly{
  0%  {opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}
}

/* Screen flash on toggle */
#flash{
  position:fixed;inset:0;
  background:#ff6a00;
  opacity:0;pointer-events:none;z-index:99;
}

/* ── HINT ───────────────────────────────────────── */
#hint{
  font-size:.78rem;color:var(--mute);margin-top:10px;
  animation:blink 1.8s ease infinite;z-index:2;position:relative;
  text-align:center;
}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}

/* ── FORM ───────────────────────────────────────── */
#form-wrap{
  position:relative;z-index:2;
  width:360px;max-width:calc(100vw - 32px);
  background:rgba(15,15,25,0.85);
  border:1px solid var(--border);
  border-radius:20px;
  padding:30px 26px;
  backdrop-filter:blur(18px);
  margin-top:20px;
  opacity:0;transform:translateY(32px);
  pointer-events:none;
}

.form-top{text-align:center;margin-bottom:22px}
.brand{
  font-size:1.05rem;font-weight:800;
  background:linear-gradient(90deg,#ff6a00,#ee0979,var(--p1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.brand-sub{font-size:.76rem;color:var(--mute);margin-top:4px}

#err-msg{
  display:none;
  background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);
  border-radius:8px;padding:8px 12px;font-size:.8rem;color:#fca5a5;
  margin-bottom:12px;text-align:center;
}

.field{margin-bottom:13px}
.field label{
  display:block;font-size:.72rem;font-weight:700;
  color:var(--mute);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.06em;
}
.field input{
  width:100%;padding:11px 14px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:var(--font);font-size:.9rem;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus{
  border-color:rgba(255,106,0,0.6);
  box-shadow:0 0 0 3px rgba(255,106,0,0.12);
}

.btn-login{
  width:100%;padding:12px;margin-top:4px;
  background:linear-gradient(135deg,#ff6a00,#ee0979);
  border:none;border-radius:10px;
  color:#fff;font-family:var(--font);font-size:.9rem;font-weight:800;
  cursor:pointer;letter-spacing:.02em;
  transition:opacity .2s,transform .1s;
  box-shadow:0 4px 20px rgba(255,106,0,0.35);
}
.btn-login:hover{opacity:.88;transform:translateY(-1px)}
.btn-login:active{transform:scale(.98)}

.divider{
  display:flex;align-items:center;gap:10px;
  margin:14px 0;color:var(--mute);font-size:.73rem;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.btn-google{
  width:100%;padding:11px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:var(--font);font-size:.87rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .2s,border-color .2s;
}
.btn-google:hover{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.2)}

.links{text-align:center;margin-top:16px;font-size:.74rem;color:var(--mute)}
.links a{color:#ff6a00;text-decoration:none}

/* ── BACK ───────────────────────────────────────── */
.back{
  position:fixed;top:18px;left:18px;
  font-size:.77rem;color:var(--mute);
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:8px;
  padding:6px 12px;text-decoration:none;transition:all .2s;z-index:10;
}
.back:hover{color:var(--text);background:rgba(255,255,255,0.08)}
</style>
</head>

<script>
// ── STATE ──────────────────────────────────────────────────
let isOn    = false;
let busy    = false;

// ── WEB AUDIO — fire roar ──────────────────────────────────
function playFireSound() {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    // Rumble oscillator
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 300;
    filter.Q.value = 0.8;
    osc1.type = 'sawtooth';
    osc2.type = 'square';
    osc1.frequency.setValueAtTime(80,  ctx.currentTime);
    osc1.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + 0.5);
    osc2.frequency.setValueAtTime(120, ctx.currentTime);
    osc2.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.5);
    osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc1.start(); osc2.start();
    osc1.stop(ctx.currentTime + 0.65);
    osc2.stop(ctx.currentTime + 0.65);
    // High crackle
    const osc3 = ctx.createOscillator();
    const g2   = ctx.createGain();
    osc3.type = 'sawtooth';
    osc3.frequency.setValueAtTime(800, ctx.currentTime);
    osc3.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);
    g2.gain.setValueAtTime(0.15, ctx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc3.connect(g2); g2.connect(ctx.destination);
    osc3.start(); osc3.stop(ctx.currentTime + 0.22);
  } catch(e) {}
}

function playExtinguish() {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.38);
  } catch(e) {}
}

// ── EMBERS ────────────────────────────────────────────────
function spawnEmbers(count = 18) {
  const wrap = document.getElementById('char-wrap');
  const rect = wrap.getBoundingClientRect();
  const ox   = rect.left + rect.width  * 0.62;
  const oy   = rect.top  + rect.height * 0.38;
  for (let i = 0; i < count; i++) {
    const e   = document.createElement('div');
    e.className = 'ember';
    const angle = Math.random() * 60 - 10; // mostly right
    const dist  = 40 + Math.random() * 120;
    const rad   = (angle * Math.PI) / 180;
    e.style.setProperty('--tx', (Math.cos(rad)*dist) + 'px');
    e.style.setProperty('--ty', (Math.sin(rad)*dist - Math.random()*60) + 'px');
    e.style.left   = ox + 'px';
    e.style.top    = oy + 'px';
    e.style.background = ['#ff6a00','#ffb300','#fff176','#ef6c00','#ffd54f'][i%5];
    e.style.animationDuration = (0.4 + Math.random()*0.5) + 's';
    e.style.animationDelay    = (Math.random()*0.15) + 's';
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 900);
  }
}

// ── SCREEN FLASH ─────────────────────────────────────────
function screenFlash() {
  const f = document.getElementById('flash');
  gsap.to(f, { opacity:.18, duration:.06, yoyo:true, repeat:1,
    onComplete:() => gsap.set(f, { opacity:0 }) });
}

// ── MAIN TOGGLE ───────────────────────────────────────────
async function toggleFire() {
  if (busy) return;
  busy = true;
  isOn = !isOn;

  const fw      = document.getElementById('form-wrap');
  const flames  = document.getElementById('flame-container');
  const glow    = document.getElementById('fire-glow');
  const mouth   = document.getElementById('mouth-open');
  const charEl  = document.getElementById('char-wrap');
  const hint    = document.getElementById('hint');

  if (isOn) {
    // ── FIRE ON ──────────────────────────────────────────
    playFireSound();
    screenFlash();
    hint.style.display = 'none';

    // Charizard recoil back then lunge forward
    gsap.timeline()
      .to(charEl, { x:-8, scaleX:.96, duration:.1, ease:'power2.in' })
      .to(charEl, { x:6, scaleX:1.04, scaleY:.97, duration:.12, ease:'power2.out' })
      .to(charEl, { x:0, scaleX:1, scaleY:1, duration:.25, ease:'elastic.out(1.2,.4)' });

    // Open mouth
    gsap.to(mouth, { opacity:1, duration:.15 });

    // Fire glow background
    gsap.to(document.body, { backgroundColor:'#1a0e08', duration:.5 });
    gsap.to(glow, { opacity:1, duration:.4 });

    // Charizard orange aura
    gsap.to(charEl, {
      filter:'drop-shadow(0 0 28px #ff6a00) drop-shadow(0 0 60px rgba(255,106,0,0.5))',
      duration:.4
    });

    // Flame breath shoot in
    gsap.fromTo(flames,
      { opacity:0, scaleX:0, transformOrigin:'left center' },
      { opacity:1, scaleX:1, duration:.35, ease:'power3.out' }
    );

    // Spawn embers
    spawnEmbers(22);
    setTimeout(() => spawnEmbers(14), 200);

    // Show form
    fw.style.pointerEvents = 'all';
    gsap.fromTo(fw,
      { opacity:0, y:30, scale:.96 },
      { opacity:1, y:0,  scale:1, duration:.55, delay:.2, ease:'back.out(1.5)' }
    );

    // Keep embers going periodically while on
    charEl._emberInterval = setInterval(() => {
      if (isOn) spawnEmbers(6);
    }, 800);

  } else {
    // ── FIRE OFF ─────────────────────────────────────────
    playExtinguish();
    clearInterval(document.getElementById('char-wrap')._emberInterval);

    hint.style.display = 'block';

    // Close mouth
    gsap.to(mouth, { opacity:0, duration:.2 });

    // Retract flames
    gsap.to(flames, { opacity:0, scaleX:0, duration:.28,
      transformOrigin:'left center', ease:'power2.in' });

    // Glow fades
    gsap.to(document.body, { backgroundColor:'#0d0d12', duration:.6 });
    gsap.to(glow, { opacity:0, duration:.45 });
    gsap.to(charEl, {
      filter:'drop-shadow(0 12px 32px rgba(0,0,0,0.6))',
      duration:.5
    });

    // Form hide
    gsap.to(fw, {
      opacity:0, y:20, scale:.96, duration:.35, ease:'power2.in',
      onComplete:() => { fw.style.pointerEvents='none'; }
    });

    // Shake to confirm off
    gsap.to(charEl, { x:-4, duration:.08, yoyo:true, repeat:3, ease:'none',
      onComplete:() => gsap.set(charEl, { x:0 })
    });
  }

  setTimeout(() => { busy = false; }, 600);
}

// ── LOGIN SUBMIT ──────────────────────────────────────────
async function submitLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-submit');
  const err = document.getElementById('err-msg');
  err.style.display = 'none';
  btn.textContent = '🔥 Entrando...'; btn.disabled = true;
  try {
    const r = await fetch('/api/auth/login', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value,
      })
    });
    const d = await r.json();
    if (r.ok && (d.ok || d.success)) {
      btn.textContent = '✓ Accediendo...';
      spawnEmbers(30);
      setTimeout(() => { window.location.href = d.redirect || '/admin'; }, 600);
    } else {
      err.textContent = d.detail || d.message || 'Credenciales incorrectas';
      err.style.display = 'block';
      gsap.fromTo('#form-wrap',{x:-8},{x:0,duration:.08,repeat:5,yoyo:true,ease:'none'});
      btn.textContent = '🔥 Entrar al panel'; btn.disabled = false;
    }
  } catch(ex) {
    err.textContent = 'Error de conexión. ¿Está el servidor activo?';
    err.style.display = 'block';
    btn.textContent = '🔥 Entrar al panel'; btn.disabled = false;
  }
}

function googleLogin() { window.location.href = '/auth/google'; }

// ── URL ERROR PARAMS ──────────────────────────────────────
(function() {
  const p   = new URLSearchParams(location.search);
  const msg = p.get('message') || p.get('error');
  if (msg) {
    document.getElementById('err-msg').textContent = decodeURIComponent(msg);
    document.getElementById('err-msg').style.display = 'block';
    setTimeout(toggleFire, 600);
  }
})();
</script>
